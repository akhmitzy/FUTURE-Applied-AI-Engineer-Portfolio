[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "future-coach-agent"
version = "0.1.0"
description = "Tool-calling AI coaching agent: LangGraph, Pydantic tools, SSE streaming, Langfuse evals, AWS via Terraform"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0",
  "langchain-core>=1.0",
  "langchain-anthropic>=1.0",
  "langchain-aws>=1.0",
  "langfuse>=3.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "httpx>=0.27",
  "tenacity>=9.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6"]

[tool.setuptools]
packages = ["app", "evals"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "E741", "B008"]  # B008: FastAPI Depends/Header defaults are idiomatic
